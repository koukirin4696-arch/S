<meta property="og:description" content="Play minecraft 1.8 in your browser" />
<script type="text/javascript">
"use strict";
const relayId = Math.floor(Math.random() * 3);

// %%%%%%%%% launch options %%%%%%%%%%%%

window.eaglercraftXOptsHints = {
	hintsVersion: 1,
	container: "game_frame",
	worldsDB: "worlds",
	relays: [
		{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
		{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
		{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 }
	],
	checkRelaysForUpdates: true
};

window.eaglercraftXOptsHints.touchscreen = true;
window.eaglercraftXOptsHints.html5CursorSupport = true;

(function() {
	var mockPointerLockElement = null;
	var doc = document;
	function dispatchPointerLockChange() {
		try {
			doc.dispatchEvent(new Event("pointerlockchange"));
		} catch (e) {}
	}
	function setMockPointerLockElement(element) {
		mockPointerLockElement = element;
		try {
			Object.defineProperty(doc, "pointerLockElement", {
				configurable: true,
				get: function() {
					return mockPointerLockElement;
				}
			});
		} catch (e) {}
	}
	setMockPointerLockElement(null);
	if (window.HTMLElement && !window.HTMLElement.prototype.requestPointerLock) {
		window.HTMLElement.prototype.requestPointerLock = function() {
			setMockPointerLockElement(this);
			dispatchPointerLockChange();
		};
	}
	if (window.HTMLElement && !window.HTMLElement.prototype.webkitRequestPointerLock) {
		window.HTMLElement.prototype.webkitRequestPointerLock = function() {
			setMockPointerLockElement(this);
			dispatchPointerLockChange();
		};
	}
	if (!doc.exitPointerLock) {
		doc.exitPointerLock = function() {
			setMockPointerLockElement(null);
			dispatchPointerLockChange();
		};
	}
	if (!doc.webkitExitPointerLock) {
		doc.webkitExitPointerLock = doc.exitPointerLock;
	}
})();

// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

</script>
